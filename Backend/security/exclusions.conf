# Reject internal management and telemetry at the public entry point.
SecRule REQUEST_URI "@rx ^/(?:internal(?:/|$)|metrics(?:/|$))" "id:100001,phase:1,deny,status:404,nolog"

# Only the method-enforcement check is exempted, only for the authenticated
# admin deletion endpoint. All payload rules and API authorization remain active.
SecRule REQUEST_METHOD "@streq DELETE" "id:100002,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/admin/users/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" "ctl:ruleRemoveById=911100"
