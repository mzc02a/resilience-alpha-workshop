global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: auth-api
    static_configs:
      - targets: ["auth-api:8001"]
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:8000"]
  - job_name: ml-api
    scrape_interval: 15s
    static_configs:
      - targets: ["ml-api:8002"]
  - job_name: gateway
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: remediator
    static_configs:
      - targets: ["remediator:8081"]
